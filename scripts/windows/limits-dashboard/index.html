<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>داشبورد لیمیت Codex</title>
  <link rel="stylesheet" href="/dashboard.css">
  <script defer src="/dashboard.js"></script>
</head>
<body>
  <main>
    <header>
      <div><div class="eyebrow">CODEX / LOCAL MONITOR</div>
        <h1>لیمیت حساب‌ها</h1>
        <p>سهمیهٔ باقی‌مانده و زمان بازنشانی هر پروفایل</p>
      </div>
      <button id="refresh" type="button"><span class="refresh-icon" aria-hidden="true">↻</span> به‌روزرسانی الآن</button>
    </header>
    <section class="overview" aria-label="خلاصه">
      <div><small>پروفایل‌ها</small><strong id="total">—</strong></div>
      <div><small>دادهٔ تازه</small><strong id="ready">—</strong></div>
      <div><small>به‌روزرسانی بعدی</small><strong id="countdown">—</strong></div>
    </section>
    <p id="state" role="status">در حال اتصال به مانیتور محلی…</p>
    <section class="toolbar" aria-label="تنظیمات نمایش">
    <label>جست‌وجو <input id="search" type="search" placeholder="شماره، نام یا ایمیل"></label>
    <label>فیلتر
      <select id="filter">
        <option value="all">همهٔ حساب‌ها</option>
        <option value="ready">آمادهٔ استفاده</option>
        <option value="blocked">فعلاً غیرقابل استفاده</option>
        <option value="credits">دارای کوپن</option>
        <option value="login">نیاز به ورود</option>
      </select>
    </label>
    <label for="sort">مرتب‌سازی
      <select id="sort">
        <option value="profile">شمارهٔ پروفایل</option>
        <option value="300">نزدیک‌ترین بازنشانی ۵ ساعته</option>
        <option value="10080">نزدیک‌ترین بازنشانی هفتگی</option>
      </select>
    </label>
    <label>نمایش <select id="view"><option value="cards">کارت‌ها</option><option value="table">جدول فشرده</option></select></label>
    <label><input id="hide-email" type="checkbox"> مخفی‌کردن ایمیل‌ها</label>
    <label><input id="alerts" type="checkbox"> اعلان بازگشت سهمیه</label>
    </section>
    <p id="recovery" role="status" hidden></p>
    <section id="accounts" class="grid" aria-label="حساب‌ها"></section>
    <footer>به‌روزرسانی خودکار هر دقیقه · تاریخ میلادی و ساعت محلی مرورگر</footer>
  </main>
</body>
</html>
